<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adicionar Link</title>
</head>
<body>

    <h2>Adicionar Link</h2>
    <form action="/add-link" method="post">
        <label for="link">Digite o URL:</label>
        <input type="text" id="link" name="link" placeholder="Digite o URL" required><br><br>
        <button type="submit">Adicionar Link</button>
    </form>

    <!-- Mensagem de sucesso ou erro -->
    <p th:text="${message}"></p>

</body>
</html>
