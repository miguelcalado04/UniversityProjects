<!-- resources/templates/hacker-index.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Indexar do Hacker News</title>
</head>
<body>
    <h2>Indexar conteúdos do Hacker News</h2>

    <form action="#" th:action="@{/hacker-index}" method="post">
        <label for="keywords">Palavras-chave:</label>
        <input type="text" id="keywords" name="keywords" placeholder="ex: AI tecnologia futuro" required>
        <button type="submit">Indexar</button>
    </form>

    <p th:text="${message}"></p>
</body>
</html>
