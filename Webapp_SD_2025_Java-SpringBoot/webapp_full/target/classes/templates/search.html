<!-- search.html -->
<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Pesquisa</title>
</head>
<body>
    <h1>Pesquisar</h1>
    <form action="/search" method="get">
        <label for="keywords">Palavra-chave:</label>
        <input type="text" id="keywords" name="keywords" th:value="${keywords}" required>
        <button type="submit">Pesquisar</button>
    </form>
    <br>

    <!-- Mostrar os resultados da pesquisa -->
    <div>
        <h2>Resultados:</h2>
        <div>
            <ul>
                <th:block th:each="result : ${results}">
                    <li>
                        <p><strong>Título:</strong> <span th:text="${result.title}">Título</span></p>
                        <p><strong>URL:</strong> <a th:href="${result.url}" th:text="${result.url}">Link</a></p>
                        <p><strong>Citação:</strong> <span th:text="${result.Excerto}">Excerto</span></p>
                        <p><strong>Links associados:</strong> <span th:text="${result.relatedUrls}">Links</span></p>
                    </li>
                    <hr>
                </th:block>
            </ul>
        </div>
        <!-- Análise Contextual da IA -->
        <div th:if="${iaAnalysis}">
            <h2>Análise Contextual da IA</h2>
            <pre th:text="${iaAnalysis}" style="background:#f4f4f4; padding:1em; white-space:pre-wrap;"></pre>
        </div>
        <!-- Paginação -->
        <div>
        <!-- Página anterior -->
        <form method="get" action="/search">
            <input type="hidden" name="keywords" th:value="${keywords}" />
            <input type="hidden" name="page" th:value="${page != null && page > 1 ? page - 1 : 1}" th:if="${page != null and page > 1}" />
            <button type="submit" th:if="${page != null and page > 1}">Página anterior</button>
        </form>

        <!-- Próxima página -->
        <form method="get" action="/search">
            <input type="hidden" name="keywords" th:value="${keywords}" />
            <input type="hidden" name="page" th:value="${page != null ? page + 1 : 2}" />
            <button type="submit">Próxima página</button>
        </form>
    </div>
</body>
</html>
