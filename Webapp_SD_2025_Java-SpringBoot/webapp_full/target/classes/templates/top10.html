<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Top 10 Pesquisas</title>

    <meta name="theme-color" content="#712cf9">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1.6.1/dist/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    
    <style>
        body {
            padding-top: 4.5rem;
        }
    </style>
</head>
<body class="d-flex flex-column h-100">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-md navbar-dark fixed-top bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Sistema de Pesquisas</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarCollapse"
                aria-controls="navbarCollapse" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
        </div>
    </nav>

    <main class="container">
        <div class="bg-body-tertiary p-5 rounded mt-4">
            <h1 class="mb-4">Top 10 Pesquisas Mais Comuns</h1>
            <ul id="top10-list" class="list-group"></ul> 
        </div>
    </main>

  
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>

    <script>
        function renderTop10Searches(top10Searches) {
            const listElement = document.getElementById('top10-list');
            listElement.innerHTML = '';

            top10Searches.forEach(search => {
                const listItem = document.createElement('li');
                listItem.className = 'list-group-item';
                listItem.textContent = `${search.search}: ${search.count}`;
                listElement.appendChild(listItem);
            });
        }

        const socket = new SockJS('/my-websocket');
const stompClient = Stomp.over(socket);

stompClient.connect({}, function (frame) {
    console.log('Conectado: ' + frame);
    
    stompClient.subscribe('/topic/top10', function (messageOutput) {
        const top10Searches = JSON.parse(messageOutput.body);
        renderTop10Searches(top10Searches);
    });
}, function (error) {
    console.log('Erro ao conectar ao WebSocket:', error);
});
    </script>

</body>
</html>
